<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self';" />
  <title>和大肥鱼聊天</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      font-size: 14px;
      color: #1f2937;
    }

    #wrap {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      background: rgba(255,255,255,.96);
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 16px;
      box-shadow: 0 8px 28px rgba(0,0,0,.18);
      overflow: hidden;
    }

    /* 顶部栏 */
    #head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(0,0,0,.06);
      background: rgba(255,255,255,.6);
    }
    #head-title {
      font-weight: 600;
      font-size: 15px;
      color: #111827;
    }
    #head-btns {
      display: flex;
      gap: 6px;
    }
    #head-btns button {
      border: none;
      background: transparent;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 16px;
      line-height: 1;
      color: #6b7280;
      transition: background .15s, color .15s;
    }
    #head-btns button:hover { background: rgba(0,0,0,.06); color: #111827; }

    /* 消息列表 */
    #msgs {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 88%;
      padding: 9px 12px;
      border-radius: 12px;
      line-height: 1.55;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .msg.me {
      align-self: flex-end;
      background: #3b82f6;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.fish {
      align-self: flex-start;
      background: #f3f4f6;
      color: #1f2937;
      border-bottom-left-radius: 4px;
    }
    .msg .meta {
      font-size: 11px;
      margin-top: 4px;
      opacity: .7;
    }
    .msg .undo-btn {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 10px;
      font-size: 12px;
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      color: inherit;
    }
    .msg .undo-btn:hover { background: rgba(0,0,0,.06); }

    /* 底部输入 */
    #foot {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      padding: 10px 12px 12px;
      border-top: 1px solid rgba(0,0,0,.06);
      background: rgba(255,255,255,.6);
    }
    #input {
      flex: 1;
      resize: none;
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 10px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 14px;
      line-height: 1.45;
      max-height: 90px;
      background: rgba(255,255,255,.9);
      outline: none;
    }
    #input:focus { border-color: #3b82f6; }
    #send {
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 14px;
      font-family: inherit;
      background: #3b82f6;
      color: #fff;
      cursor: pointer;
      transition: background .15s;
    }
    #send:hover { background: #2563eb; }
    #send:active { transform: translateY(1px); }

    /* 设置面板 */
    #config {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,.98);
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }
    #config.hidden { display: none; }
    .cfg-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .cfg-row label {
      font-size: 12px;
      color: #6b7280;
    }
    .cfg-row input {
      border: 1px solid rgba(0,0,0,.14);
      border-radius: 8px;
      padding: 7px 10px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }
    .cfg-row input:focus { border-color: #3b82f6; }
    .cfg-btns {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .cfg-btns button {
      flex: 1;
      border: none;
      border-radius: 8px;
      padding: 8px 0;
      font-size: 13px;
      font-family: inherit;
      cursor: pointer;
    }
    .cfg-primary { background: #3b82f6; color: #fff; }
    .cfg-primary:hover { background: #2563eb; }
    .cfg-ghost { background: #f3f4f6; color: #374151; }
    .cfg-ghost:hover { background: #e5e7eb; }
    .cfg-hint {
      font-size: 12px;
      color: #9ca3af;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="head">
      <span id="head-title">大肥鱼</span>
      <div id="head-btns">
        <button id="btn-cfg" title="设置">⚙</button>
        <button id="btn-close" title="关闭">✕</button>
      </div>
    </div>
    <div id="msgs"></div>
    <div id="foot">
      <textarea id="input" rows="1" placeholder="说点什么…"></textarea>
      <button id="send">发送</button>
    </div>
  </div>

  <div id="config" class="hidden">
    <div class="cfg-row">
      <label>服务地址</label>
      <input id="cfg-url" type="text" placeholder="https://api.example.com/v1" />
    </div>
    <div class="cfg-row">
      <label>模型名</label>
      <input id="cfg-model" type="text" placeholder="deepseek-chat" />
    </div>
    <div class="cfg-row">
      <label>API Key</label>
      <input id="cfg-key" type="password" placeholder="sk-xxxxxxxx" />
    </div>
    <div class="cfg-row">
      <label>
        <input id="cfg-enabled" type="checkbox" />
        启用云端 AI
      </label>
    </div>
    <div class="cfg-btns">
      <button id="cfg-save" class="cfg-primary">保存</button>
      <button id="cfg-test" class="cfg-ghost">测试连接</button>
    </div>
    <div class="cfg-hint">
      不填也能用，只是闲聊会变成大肥鱼自己的台词。<br/>
      Key 只存在你自己的电脑上，不会上传。
    </div>
    <div class="cfg-btns">
      <button id="cfg-back" class="cfg-ghost">← 返回聊天</button>
    </div>
  </div>

  <script src="./chat.js"></script>
</body>
</html>
