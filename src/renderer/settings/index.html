<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 只显示本地内容，不需要 eval，CSP 收紧到最小 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src 'self' data:" />
  <title>日程管理</title>
  <style>
    :root {
      --bg: #f7f8fa;
      --card: #ffffff;
      --line: #e5e7eb;
      --text: #1f2937;
      --muted: #6b7280;
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --danger: #ef4444;
      --ok: #10b981;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      font-size: 14px;
    }
    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ---------- 顶部 ---------- */
    header {
      padding: 16px 18px 12px;
      background: var(--card);
      border-bottom: 1px solid var(--line);
      flex: none;
    }
    h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 600;
    }
    .sub {
      margin: 4px 0 0;
      font-size: 12px;
      color: var(--muted);
    }

    /* ---------- 工具栏 ---------- */
    .toolbar {
      display: flex;
      gap: 8px;
      padding: 12px 18px;
      flex: none;
    }
    button {
      font-family: inherit;
      font-size: 13px;
      border-radius: 8px;
      padding: 7px 14px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: background .15s, border-color .15s, color .15s;
    }
    button:active { transform: translateY(1px); }

    .primary { background: var(--primary); color: #fff; }
    .primary:hover { background: var(--primary-dark); }

    .ghost { background: var(--card); border-color: var(--line); color: var(--text); }
    .ghost:hover { border-color: #cbd5e1; background: #f9fafb; }

    .danger { background: var(--card); border-color: var(--line); color: var(--danger); }
    .danger:hover { border-color: var(--danger); background: #fef2f2; }

    /* ---------- 添加 / 编辑表单 ---------- */
    #form {
      margin: 0 18px 12px;
      padding: 14px 16px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      flex: none;
    }
    #form.hidden { display: none; }

    #form-title {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 600;
    }

    .field {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 9px;
    }
    .field > span {
      flex: none;
      width: 54px;
      font-size: 13px;
      color: var(--muted);
    }
    .field input,
    .field select {
      flex: 1;
      min-width: 0;
      font-family: inherit;
      font-size: 13px;
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--text);
    }
    .field input:focus,
    .field select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, .13);
    }
    .field.hidden { display: none; }

    /* 星期几多选 */
    #wd-list {
      flex: 1;
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    #wd-list label {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: 12px;
      color: var(--text);
      padding: 4px 7px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      cursor: pointer;
      user-select: none;
    }
    #wd-list label:has(input:checked) {
      border-color: var(--primary);
      background: #eff6ff;
      color: var(--primary-dark);
    }
    #wd-list input { margin: 0; accent-color: var(--primary); }

    #form-error {
      margin: 8px 0 0;
      padding: 7px 10px;
      font-size: 12.5px;
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 7px;
    }
    #form-error.hidden { display: none; }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }

    /* ---------- 日程列表 ---------- */
    .list-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 0 18px 18px;
    }
    #list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 11px;
      padding: 11px 13px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 11px;
    }
    .item.off { opacity: .5; }

    /* 开关：点一下临时静音，不删掉 */
    .switch {
      flex: none;
      width: 34px;
      height: 20px;
      padding: 0;
      border: none;
      border-radius: 999px;
      background: #d1d5db;
      position: relative;
      cursor: pointer;
      transition: background .18s;
    }
    .switch::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .25);
      transition: transform .18s;
    }
    .switch[aria-pressed="true"] { background: var(--ok); }
    .switch[aria-pressed="true"]::after { transform: translateX(14px); }

    .item .main {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .item .time {
      font-size: 15px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .item .title {
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 190px;
    }
    .item .repeat {
      font-size: 11.5px;
      color: var(--muted);
      background: #f3f4f6;
      border-radius: 5px;
      padding: 1px 6px;
    }
    .item.off .repeat::after {
      content: " · 已关掉";
      color: #9ca3af;
    }

    .item .actions {
      flex: none;
      display: flex;
      gap: 5px;
    }
    .item .actions button {
      padding: 4px 9px;
      font-size: 12px;
    }

    /* ---------- 周视图 ---------- */
    /* 8 个色：方块按「标题」稳定取色（同一个标题永远同色，见 week.js 的 colorOf） */
    #week {
      --c-blue: #3b82f6;
      --c-teal: #14b8a6;
      --c-amber: #f59e0b;
      --c-pink: #ec4899;
      --c-purple: #8b5cf6;
      --c-green: #22c55e;
      --c-coral: #fb7185;
      --c-gray: #94a3b8;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      padding: 0 18px 18px;
    }
    #week.hidden { display: none; }
    .list-wrap.hidden { display: none; }

    #week-head {
      flex: none;
      display: grid;
      grid-template-columns: 52px repeat(7, 1fr);
    }
    #week-head .day-head {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      padding: 4px 0 6px;
    }
    #week-head .day-head.today { color: var(--primary-dark); font-weight: 600; }

    #week-grid {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    #week-canvas {
      display: grid;
      grid-template-columns: 52px repeat(7, 1fr);
    }

    /* 左边那一条时间刻度 */
    .hour-col { position: relative; }
    .hour {
      font-size: 10.5px;
      color: var(--muted);
      text-align: right;
      padding-right: 6px;
      border-top: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
    }

    .day-col {
      position: relative;
      border-left: 1px solid var(--line);
    }
    .day-col.today { background: #eff6ff; }

    /* 空白格：点一下就在这一格新建日程。z-index 低于方块，不会挡住点方块 */
    .slot {
      position: absolute;
      left: 0;
      right: 0;
      border-top: 1px solid #f1f3f5;
      z-index: 1;
      cursor: pointer;
    }
    .slot:hover { background: #f8fafc; }

    /* 方块：时段是高的长方体，时间点是扁的（.point 只有 22px 高） */
    .blk {
      position: absolute;
      left: 3px;
      right: 3px;
      z-index: 2;
      border-radius: 6px;
      padding: 2px 5px;
      font-size: 11px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      cursor: pointer;
      color: #fff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, .18);
    }
    .blk.point { height: 22px; }
    .blk.off { opacity: .45; } /* 关掉的日程：变淡，但还在（和列表一致） */
    .blk[data-color="blue"]   { background: var(--c-blue); }
    .blk[data-color="teal"]   { background: var(--c-teal); }
    .blk[data-color="amber"]  { background: var(--c-amber); }
    .blk[data-color="pink"]   { background: var(--c-pink); }
    .blk[data-color="purple"] { background: var(--c-purple); }
    .blk[data-color="green"]  { background: var(--c-green); }
    .blk[data-color="coral"]  { background: var(--c-coral); }
    .blk[data-color="gray"]   { background: var(--c-gray); }

    /* ---------- 空状态 ---------- */
    #empty {
      margin: 34px 18px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.9;
    }
    #empty.hidden { display: none; }
    #empty .big { font-size: 30px; display: block; margin-bottom: 6px; }

    /* ---------- 专注页（v3） ---------- */
    /* 进专注页时，把「日程那一套」整体藏起来（header / 工具栏 / 表单 / 列表 / 周视图）。
       用一个 body 上的类来切，比逐个元素 toggle 更不容易漏。 */
    body.focus-mode header,
    body.focus-mode .toolbar,
    body.focus-mode #form,
    body.focus-mode .list-wrap,
    body.focus-mode #week { display: none; }

    #focus-page {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px 18px 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    #focus-page.hidden { display: none; }

    .focus-top {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: none;
    }
    .focus-top h1 { font-size: 17px; }

    .focus-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      flex: none;
    }
    .focus-h {
      margin: 0 0 4px;
      font-size: 14px;
      font-weight: 600;
    }
    .focus-hint {
      margin: 4px 0 10px;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.7;
    }

    .focus-col + .focus-col { margin-top: 12px; }
    .focus-col-head {
      font-size: 12.5px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .focus-add {
      display: flex;
      gap: 8px;
    }
    .focus-add input {
      flex: 1;
      min-width: 0;
      font-family: inherit;
      font-size: 13px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #fff;
      color: var(--text);
    }
    .focus-add input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, .13);
    }
    .focus-add button { flex: none; padding: 7px 12px; }

    .focus-list {
      list-style: none;
      margin: 8px 0 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .focus-list:empty { display: none; }
    .focus-list li {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: #f9fafb;
      border: 1px solid var(--line);
      border-radius: 7px;
      font-size: 13px;
    }
    .focus-list li .focus-val {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .focus-list li .focus-del {
      flex: none;
      padding: 1px 8px;
      font-size: 14px;
      line-height: 1.4;
      border-radius: 6px;
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--muted);
      cursor: pointer;
    }
    .focus-list li .focus-del:hover { border-color: var(--danger); color: var(--danger); }

    #focus-error {
      margin: 10px 0 0;
      padding: 7px 10px;
      font-size: 12.5px;
      color: #b91c1c;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 7px;
    }
    #focus-error.hidden { display: none; }

    .focus-presets {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .focus-presets button {
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--text);
    }
    .focus-presets button:hover { border-color: #cbd5e1; background: #f9fafb; }
    .focus-presets button.on {
      border-color: var(--primary);
      background: #eff6ff;
      color: var(--primary-dark);
      font-weight: 600;
    }

    #focus-custom-row { margin-top: 10px; }
    #focus-custom-row.hidden { display: none; }
    #focus-custom-row input {
      flex: 1;
      min-width: 0;
      font-family: inherit;
      font-size: 13px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
    }

    #focus-run { text-align: center; }
    #focus-idle.hidden, #focus-running.hidden { display: none; }
    .focus-start {
      width: 100%;
      padding: 12px 0;
      font-size: 15px;
      font-weight: 600;
    }
    .focus-ring-wrap {
      position: relative;
      width: 150px;
      height: 150px;
      margin: 4px auto 10px;
    }
    .focus-ring { width: 150px; height: 150px; transform: rotate(-90deg); }
    .focus-ring .ring-bg { fill: none; stroke: #eef1f5; stroke-width: 9; }
    .focus-ring .ring-fg {
      fill: none;
      stroke: var(--primary);
      stroke-width: 9;
      stroke-linecap: round;
      transition: stroke-dashoffset .5s linear;
    }
    .focus-countdown {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }
    .focus-stop {
      width: 100%;
      padding: 11px 0;
      font-size: 14px;
      user-select: none;
    }
    .focus-stop.holding {
      background: #fef2f2;
      border-color: var(--danger);
    }
  </style>
</head>
<body>
  <header>
    <h1>日程管理</h1>
    <p class="sub">到点时，桌宠会冒泡提醒你。错过 5 分钟以内的，开机后还会补上。</p>
  </header>

  <div class="toolbar">
    <button id="btn-add" class="primary">＋ 添加日程</button>
    <button id="btn-preview" class="ghost" title="立刻弹一次提醒，看看效果">预览提醒效果</button>
    <button id="btn-week" class="ghost" title="按周一到周日看看这一周的安排">周视图</button>
    <button id="btn-focus" class="ghost" title="开始一段专注：挡住分心的网站和软件">专注</button>
  </div>

  <!-- 添加 / 编辑共用同一块表单，靠 editingId 区分 -->
  <div id="form" class="hidden">
    <h2 id="form-title">添加日程</h2>

    <div class="field">
      <span>做什么</span>
      <input id="f-title" maxlength="100" placeholder="例如：开会" autocomplete="off" />
    </div>

    <div class="field">
      <span>几点</span>
      <input id="f-time" type="time" value="09:00" />
    </div>

    <!-- v2：日程分两种 —— 时间点（到点响一下）/ 时段（占一段时间） -->
    <div class="field">
      <span>类型</span>
      <select id="f-kind">
        <option value="point">时间点（到点提醒一下）</option>
        <option value="span">时段（占一段时间）</option>
      </select>
    </div>

    <div class="field hidden" id="row-endtime">
      <span>到几点</span>
      <input id="f-endtime" type="time" value="11:00" />
    </div>

    <div class="field">
      <span>重复</span>
      <select id="f-repeat">
        <option value="once">只提醒一次</option>
        <option value="daily">每天</option>
        <option value="weekdays">工作日（周一到周五）</option>
        <option value="weekly">每周（自己选星期几）</option>
      </select>
    </div>

    <div class="field" id="row-date">
      <span>哪一天</span>
      <input id="f-date" type="date" />
    </div>

    <div class="field hidden" id="row-weekdays">
      <span>星期几</span>
      <div id="wd-list"></div>
    </div>

    <div id="form-error" class="hidden"></div>

    <div class="form-actions">
      <button id="btn-cancel" class="ghost">取消</button>
      <button id="btn-save" class="primary">保存</button>
    </div>
  </div>

  <div class="list-wrap">
    <ul id="list"></ul>
    <div id="empty" class="hidden">
      <span class="big">🗓</span>
      还没有日程。<br />点上面的「＋ 添加日程」试试。
    </div>
  </div>

  <!-- 周视图：固定周一到周日，不翻页（主人拍板）。
       列头 + 可滚动的网格；方块的位置和颜色都由主进程算好（比例），这里只乘像素。 -->
  <div id="week" class="hidden">
    <div id="week-head"></div>
    <div id="week-grid"><div id="week-canvas"></div></div>
  </div>

  <!-- 专注页（v3）：不新建窗口，就在这个窗口里切一页。
       三块：要挡住的东西 / 专注多久 / 开始 + 倒计时。 -->
  <div id="focus-page" class="hidden">
    <div class="focus-top">
      <button id="btn-focus-back" class="ghost">← 返回日程</button>
      <h1>专注</h1>
    </div>

    <!-- 1. 要挡住的东西 -->
    <section class="focus-card">
      <h2 class="focus-h">要挡住的东西</h2>
      <p class="focus-hint">开始专注后，这些网站打不开、这些软件会被关掉。专注结束自动恢复。</p>

      <div class="focus-col">
        <div class="focus-col-head">网站</div>
        <div class="focus-add">
          <input id="f-domain-input" placeholder="比如 bilibili.com" autocomplete="off" />
          <button id="btn-add-domain" class="primary" title="加进黑名单">＋</button>
        </div>
        <ul id="focus-domains" class="focus-list"></ul>
      </div>

      <div class="focus-col">
        <div class="focus-col-head">软件</div>
        <div class="focus-add">
          <input id="f-exe-input" placeholder="比如 steam.exe" autocomplete="off" />
          <button id="btn-add-exe" class="primary" title="加进黑名单">＋</button>
        </div>
        <ul id="focus-exes" class="focus-list"></ul>
      </div>

      <div id="focus-error" class="hidden"></div>
    </section>

    <!-- 2. 专注多久 -->
    <section class="focus-card">
      <h2 class="focus-h">专注多久</h2>
      <p class="focus-hint">选一个时长，或者自己填一个。</p>
      <div id="focus-presets" class="focus-presets"></div>
      <div id="focus-custom-row" class="focus-add hidden">
        <input id="f-custom-min" type="number" min="1" max="1440" placeholder="填多少分钟，比如 90" />
        <button id="btn-custom-ok" class="ghost">用这个</button>
      </div>
    </section>

    <!-- 3. 开始 / 倒计时 -->
    <section class="focus-card" id="focus-run">
      <div id="focus-idle">
        <button id="btn-focus-start" class="primary focus-start">开始专注</button>
        <p class="focus-hint" id="focus-idle-hint">开始后，大肥鱼会陪着你，中途想提前结束得长按 3 秒。</p>
      </div>

      <div id="focus-running" class="hidden">
        <div class="focus-ring-wrap">
          <svg class="focus-ring" viewBox="0 0 120 120" aria-hidden="true">
            <circle class="ring-bg" cx="60" cy="60" r="52"></circle>
            <circle id="focus-ring-fg" class="ring-fg" cx="60" cy="60" r="52"></circle>
          </svg>
          <div id="focus-countdown" class="focus-countdown">25:00</div>
        </div>
        <button id="btn-focus-stop" class="danger focus-stop">长按 3 秒结束</button>
        <p class="focus-hint" id="focus-stop-hint"></p>
      </div>
    </section>
  </div>

  <script src="./settings.js"></script>
</body>
</html>
