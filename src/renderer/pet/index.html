<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!--
    CSP 说明：
      'unsafe-eval' 是 PIXI 6 逼出来的 —— 它用 new Function() 现场拼 shader 源码，
      不放开就会报 "Current environment does not allow unsafe-eval"。
      渲染进程不加载任何远程内容，只读本地文件，风险可控。
      若以后想收紧，可改用官方 @pixi/unsafe-eval 包（把 eval 收进一个受控入口）。
      img-src 的 data: blob: 给 Live2D 贴图解码用。
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:" />
  <title>桌宠</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: transparent;   /* 关键：窗口透明的最后一环 */
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      user-select: none;
      -webkit-user-drag: none;
      cursor: default;
    }
    #stage { position: absolute; inset: 0; }
    #stage canvas { display: block; }

    /* 加载提示：模型就绪后淡出 */
    #hint {
      position: absolute;
      left: 0; right: 0; bottom: 12px;
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      text-shadow: 0 0 4px #fff, 0 0 8px #fff;
      transition: opacity .4s;
      pointer-events: none;
    }
    #hint.gone { opacity: 0; }
    #hint.error { color: #b91c1c; }

    /* 界面控件层：尺寸由 renderer.js 的 syncUiBox() 对齐到画布。
       ⚠ 为什么按钮不能直接贴窗口右边（原来就是那么写的）：
         这台机器是 1.5 倍缩放，窗口外框尺寸会**随位置变**（实测停在 1259,639 时是
         404×384，停在 1087,618 时是 404×382 —— Windows 的 DPI 取整）。
         而渲染进程的画布是启动时按当时尺寸定死的、之后不会跟着变，
         角色就钉在原处。按钮如果贴窗口右边定位，窗口一宽/一窄就跟角色错位 ——
         主人报的「拖拽时设置按钮自动右移」就是这么来的（HANDOFF 第六节第 32 条）。
         套一层跟画布同尺寸的容器之后，按钮永远跟角色锁在一起。 */
    #ui {
      position: absolute;
      left: 0;
      top: 0;
      pointer-events: none;   /* 空白处照旧穿过去点桌面；按钮自己再打开 */
    }
    #ui > button { pointer-events: auto; }

    /* 右上角两个小按钮：日程管理 / 退出。
       ⚠ 它们不在 WebGL 画布上，所以鼠标穿透的「读像素」判定看不见它们。
       必须靠 renderer.js 里 elementFromPoint 那条兜底逻辑，否则点不到。
       data-ui 就是给那条逻辑认领用的标记（以后加任何界面控件都要挂这个属性）。

       主人反馈「按钮离得远、又不显眼，根本找不到」，所以：
         · 26px → 30px，默认不透明度 .38 → .95（以前淡得跟水印一样）
         · 白底 + 一圈白色描边（box-shadow 的第一段），不管角色是深是浅都浮得出来
         · 图标本身带颜色（日程=蓝、退出=灰红），不再是灰扑扑一团
         · 启动后「呼吸」三下，帮主人一眼发现这里有东西 */
    #btn-settings, #btn-chat, #btn-exit {
      position: absolute;
      top: 8px;
      width: 30px;
      height: 30px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, .95);
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      opacity: .95;
      box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .95), 0 2px 6px rgba(0, 0, 0, .28);
      transition: opacity .18s, background .18s, color .18s, transform .12s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #btn-exit { right: 8px; color: #64748b; }
    #btn-chat { right: 46px; color: #10b981; }
    #btn-settings { right: 84px; color: #2563eb; }
    #btn-settings:hover, #btn-chat:hover, #btn-exit:hover { opacity: 1; transform: scale(1.08); }
    #btn-settings:hover { background: #2563eb; color: #fff; }
    #btn-chat:hover { background: #10b981; color: #fff; }
    #btn-exit:hover { background: #ef4444; color: #fff; }
    #btn-settings svg { width: 17px; height: 17px; display: block; }

    /* 启动提示：轻轻「呼吸」三下，让主人注意到右上角有按钮。只放一次，之后自然恢复。 */
    @keyframes btn-attn {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.18); }
    }
    #btn-settings.attn, #btn-chat.attn, #btn-exit.attn { animation: btn-attn 1.1s ease-in-out 3; }

    /* ---------- 专注模式（v3）：角标 + 台词 ----------
       ⚠ 这两个都不是按钮，故意**不**打开 pointer-events（#ui 上是 none，它们继承）。
         所以鼠标移上去照样穿到桌面、也不会挡住右上角那几个按钮。
         data-ui 挂上只是守约定（「往桌宠界面加 DOM 元素都挂这个」），
         因为 pointer-events:none 的元素 elementFromPoint 根本返回不到，挂不挂都不影响判定。 */
    #focus-badge {
      position: absolute;
      left: 8px;
      top: 8px;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px 3px 7px;
      border-radius: 999px;
      background: rgba(37, 99, 235, .92);
      color: #fff;
      font-size: 11.5px;
      line-height: 1.5;
      font-variant-numeric: tabular-nums;
      box-shadow: 0 2px 8px rgba(15, 23, 42, .3);
      white-space: nowrap;
    }
    #focus-badge.hidden { display: none; }
    #focus-badge .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #bbf7d0;
      animation: focus-pulse 1.6s ease-in-out infinite;
    }
    @keyframes focus-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }

    /* 台词：底部一条小气泡，说一句就自己消失 */
    #pet-say {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      max-width: 92%;
      padding: 6px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, .95);
      color: #1f2937;
      font-size: 12.5px;
      line-height: 1.6;
      text-align: center;
      box-shadow: 0 0 0 1.5px rgba(255, 255, 255, .95), 0 3px 10px rgba(15, 23, 42, .22);
      opacity: 0;
      transition: opacity .25s;
    }
    #pet-say.show { opacity: 1; }
    #pet-say.hidden { display: none; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="hint">加载中…</div>

  <!-- 控件层：尺寸跟画布一致，按钮贴在它里面而不是贴在窗口上 -->
  <div id="ui">
    <button id="btn-settings" data-ui="1" title="日程管理" aria-label="日程管理">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="6.1" />
        <path d="M8 4.5V8l2.4 1.6" />
      </svg>
    </button>
    <button id="btn-chat" data-ui="1" title="和大肥鱼聊天" aria-label="和大肥鱼聊天">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;display:block;">
        <path d="M2 4.5a2 2 0 012-2h8a2 2 0 012 2v5a2 2 0 01-2 2H6l-3 2.5V4.5z" />
      </svg>
    </button>
    <button id="btn-exit" data-ui="1" title="退出桌宠" aria-label="退出桌宠">✕</button>

    <!-- 专注中的剩余时间角标（默认藏着，进专注才显示） -->
    <div id="focus-badge" class="hidden" data-ui="1">
      <span class="dot"></span>专注中 <span id="focus-badge-time">--:--</span>
    </div>

    <!-- 宠物「说」的一句话（说几秒就自己消失） -->
    <div id="pet-say" class="hidden" data-ui="1"></div>
  </div>

  <!-- 顺序不能变：PIXI → Cubism Core → pixi-live2d-display -->
  <script src="./vendor/pixi.min.js"></script>
  <script src="./vendor/live2dcubismcore.min.js"></script>
  <script src="./vendor/cubism4.min.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
