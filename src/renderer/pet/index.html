<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!--
    CSP 说明：
      'unsafe-eval' 是 PIXI 6 逼出来的 —— 它用 new Function() 现场拼 shader 源码，
      不放开就会报 "Current environment does not allow unsafe-eval"。
      渲染进程不加载任何远程内容，只读本地文件，风险可控。
      若以后想收紧，可改用官方 @pixi/unsafe-eval 包（把 eval 收进一个受控入口）。
      img-src 的 data: blob: 给 Live2D 贴图解码用。
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:" />
  <title>桌宠</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: transparent;   /* 关键：窗口透明的最后一环 */
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      user-select: none;
      -webkit-user-drag: none;
      cursor: default;
    }
    #stage { position: absolute; inset: 0; }
    #stage canvas { display: block; }

    /* 加载提示：模型就绪后淡出 */
    #hint {
      position: absolute;
      left: 0; right: 0; bottom: 12px;
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      text-shadow: 0 0 4px #fff, 0 0 8px #fff;
      transition: opacity .4s;
      pointer-events: none;
    }
    #hint.gone { opacity: 0; }
    #hint.error { color: #b91c1c; }

    /* 退出按钮。
       ⚠ 它不在 WebGL 画布上，所以鼠标穿透的「读像素」判定看不见它。
       必须靠 renderer.js 里 elementFromPoint 那条兜底逻辑，否则这个按钮点不到。
       data-ui 就是给那条逻辑认领用的标记（以后加设置按钮也挂这个属性）。 */
    #btn-exit {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 26px;
      height: 26px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(255, 255, 255, .78);
      color: #6b7280;
      font-size: 13px;
      line-height: 26px;
      text-align: center;
      cursor: pointer;
      opacity: .38;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .18);
      transition: opacity .18s, background .18s, color .18s;
    }
    #btn-exit:hover {
      opacity: 1;
      background: #ef4444;
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="hint">加载中…</div>
  <button id="btn-exit" data-ui="1" title="退出桌宠" aria-label="退出桌宠">✕</button>

  <!-- 顺序不能变：PIXI → Cubism Core → pixi-live2d-display -->
  <script src="./vendor/pixi.min.js"></script>
  <script src="./vendor/live2dcubismcore.min.js"></script>
  <script src="./vendor/cubism4.min.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
