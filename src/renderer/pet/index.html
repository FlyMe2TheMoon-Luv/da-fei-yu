<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!--
    CSP 说明：
      'unsafe-eval' 是 PIXI 6 逼出来的 —— 它用 new Function() 现场拼 shader 源码，
      不放开就会报 "Current environment does not allow unsafe-eval"。
      渲染进程不加载任何远程内容，只读本地文件，风险可控。
      若以后想收紧，可改用官方 @pixi/unsafe-eval 包（把 eval 收进一个受控入口）。
      img-src 的 data: blob: 给 Live2D 贴图解码用。
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob:" />
  <title>桌宠</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: transparent;   /* 关键：窗口透明的最后一环 */
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      user-select: none;
      -webkit-user-drag: none;
      cursor: default;
    }
    #stage { position: absolute; inset: 0; }
    #stage canvas { display: block; }

    /* 加载提示：模型就绪后淡出 */
    #hint {
      position: absolute;
      left: 0; right: 0; bottom: 12px;
      text-align: center;
      font-size: 12px;
      color: #6b7280;
      text-shadow: 0 0 4px #fff, 0 0 8px #fff;
      transition: opacity .4s;
      pointer-events: none;
    }
    #hint.gone { opacity: 0; }
    #hint.error { color: #b91c1c; }
  </style>
</head>
<body>
  <div id="stage"></div>
  <div id="hint">加载中…</div>

  <!-- 顺序不能变：PIXI → Cubism Core → pixi-live2d-display -->
  <script src="./vendor/pixi.min.js"></script>
  <script src="./vendor/live2dcubismcore.min.js"></script>
  <script src="./vendor/cubism4.min.js"></script>
  <script src="./renderer.js"></script>
</body>
</html>
